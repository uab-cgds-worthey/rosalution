services:
  rosalution-integration-db:
    image: mongo:8.3.7-noble
    volumes:
      - ./init-rs.js:/docker-entrypoint-initdb.d/01-init-rs.js
      - ./initial-db-seed.sh:/docker-entrypoint-initdb.d/02-initial-db-seed.sh
      - ../../../etc/fixtures/:/tmp/fixtures
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      - integration-test-network
    ports:
      - 27017:27017
    # extra_hosts:
    # - "host.docker.internal:host-gateway" 
    environment:
      MONGO_INITDB_DATABASE: rosalution_db
