[project]
name = "screen-capture-annotate"
version = "0.1.0"
description = "rough draft script using selenium to gather basic visual annotations from web resources"
readme = "README.md"
authors = [
    { name = "serioushorncat", email = "aeunoant@uab.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "selenium==4.46.0",
]

[dependency-groups]
dev = [
    "pylint==4.0.6",
    "yapf==0.43.0",
]
